services:
  - type: web
    name: hdux-license-service
    runtime: node
    autoDeploy: false
    region: ohio
    plan: starter
    buildCommand: cd license-service && npm install && npm run build
    startCommand: node license-service/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STRIPE_PRICE_ID
        value: price_1UStJ7GRjKD6n9dmqdwh3trU
      - key: SERVICE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
